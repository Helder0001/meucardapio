# docker/docker-compose.yml
#
# Ambiente de desenvolvimento local completo.
# Inclui PostgreSQL, Redis e MinIO (S3 compatível).
#
# Como usar:
#   docker compose -f docker/docker-compose.yml up -d
#
# Parar:
#   docker compose -f docker/docker-compose.yml down
#
# Resetar dados:
#   docker compose -f docker/docker-compose.yml down -v

version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: foodsaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodsaas
      POSTGRES_PASSWORD: devpassword123
      POSTGRES_DB: foodsaas
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foodsaas']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: foodsaas-redis
    restart: unless-stopped
    command: redis-server --requirepass devpassword123 --save 60 1
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', 'devpassword123', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ── MinIO (S3 local) ────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: foodsaas-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '9000:9000'   # API S3
      - '9001:9001'   # Console web (acesse http://localhost:9001)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 3

  # ── MailHog (emails em desenvolvimento) ─────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: foodsaas-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Interface web (acesse http://localhost:8025)

volumes:
  postgres_data:
  redis_data:
  minio_data:
